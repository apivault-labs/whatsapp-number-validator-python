[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-number-validator"
version = "0.1.0"
description = "Python SDK for WhatsApp Number Validator on Apify. Validate phone numbers and return available WhatsApp and public phone metadata through the hosted Apify Actor."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["whatsapp-validator", "phone-validation", "number-lookup", "contact-cleaning", "crm", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/whatsapp-number-validator-python"
Documentation = "https://github.com/apivault-labs/whatsapp-number-validator-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/whatsapp-number-validator"
"Bug Tracker" = "https://github.com/apivault-labs/whatsapp-number-validator-python/issues"

[tool.setuptools.packages.find]
include = ["whatsapp_number_validator*"]
